<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amigo secreto</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="cabecera">
  <h1>Amigo secreto</h1>
  <p class="subtitulo">Regalos fáciles de elegir.</p>
</header>

<main>
  <section class="paso" aria-labelledby="titulo-paso-uno">
    <p class="numero-paso" aria-hidden="true">1</p>
    <form id="formulario-persona" class="formulario-persona">
    <h2 id="titulo-paso-uno">Escribe tu nombre</h2>
    <p class="instruccion">Después escribe los regalos que te gustan.</p>
    <div class="agregar-persona">
      <input id="nombre-nuevo" type="text" maxlength="80" autocomplete="name" placeholder="Ejemplo: María" required />
      <button class="boton boton-primario" type="submit">Agregar mi nombre</button>
    </div>
    <p id="mensaje-persona" class="mensaje-persona" aria-live="polite"></p>
    </form>
  </section>

  <section class="paso paso-listas" aria-labelledby="titulo-paso-dos">
    <p class="numero-paso" aria-hidden="true">2</p>
    <h2 id="titulo-paso-dos">Toca un nombre</h2>
    <p class="instruccion">Toca tu nombre para escribir tu lista.</p>
    <p id="mensaje-carga" class="mensaje">Cargando los nombres…</p>
    <div id="cuadricula" class="cuadricula" hidden></div>
  </section>
</main>

<footer class="pie">
  <p>Sin contraseñas.</p>
</footer>

<!-- Panel que se abre al tocar una etiqueta -->
<div id="fondo" class="fondo" hidden>
  <div id="tarjeta" class="tarjeta-detalle" role="dialog" aria-modal="true" aria-labelledby="nombre-detalle">
    <button id="cerrar" class="boton-cerrar" type="button"><span aria-hidden="true">×</span> Cerrar</button>

    <p class="detalle-etiqueta">Lista de regalos de</p>
    <h2 id="nombre-detalle"></h2>

    <!-- Modo lectura -->
    <div id="vista-lectura">
      <div id="contenido-lista" class="contenido-lista"></div>
      <button id="boton-editar" class="boton boton-secundario" type="button"></button>
    </div>

    <!-- Modo edición -->
    <div id="vista-edicion" hidden>
      <p class="ayuda">Escribe una idea en cada renglón. Por ejemplo:</p>
      <textarea id="texto-edicion" rows="6" placeholder="Un libro&#10;Una planta&#10;Chocolate"></textarea>
      <div class="botonera">
        <button id="boton-cancelar" class="boton boton-texto" type="button">Volver</button>
        <button id="boton-guardar" class="boton boton-primario" type="button">Guardar mi lista</button>
      </div>
      <p id="mensaje-guardado" class="mensaje-guardado" hidden>¡Guardado!</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
